name: iPhone stock bot

on:
  # Резерв: щогодини о :23 (не рівно о :00 — тоді GitHub найчастіше пропускає запуски).
  # Основний механізм — бот сам перезапускає себе в кінці кожного прогону (крок "Restart").
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}  # ручний запуск з вкладки Actions

permissions:
  contents: read
  actions: write  # щоб крок "Restart" міг запустити наступний прогін

# Одночасно працює тільки один бот. Новий запуск чекає в черзі, поки поточний не завершиться
# (з черги лишається тільки найсвіжіший, старіші очікуючі скасовуються — це нормально).
concurrency:
  group: iphone-stock-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python iphone_stock_bot.py --max-runtime 20700

      # Детальний лог можна завантажити зі сторінки запуску (Artifacts).
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/
          retention-days: 7

      # Ланцюжок: одразу ставимо в чергу наступний прогін. Не спрацьовує, якщо запуск скасували вручну.
      - name: Restart
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
